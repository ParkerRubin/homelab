apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  settings.yaml: |
    title: Parker's Homelab
    theme: dark
    color: slate
    headerStyle: boxed
    layout:
      Monitoring:
        style: row
        columns: 2
      Apps:
        style: row
        columns: 2
  services.yaml: |
    - Monitoring:
        - Grafana:
            icon: grafana.png
            href: http://192.168.4.86:30300
            description: Cluster and NUC metrics
            siteMonitor: http://monitoring-grafana.monitoring.svc.cluster.local
        - AdGuard Home:
            icon: adguard-home.png
            href: http://192.168.4.86:30301
            description: House DNS and ad blocking
            siteMonitor: http://adguard-web.default.svc.cluster.local
    - Apps:
        - Jellyfin:
            icon: jellyfin.png
            href: http://192.168.4.86:30096
            description: Media streaming
            siteMonitor: http://jellyfin.default.svc.cluster.local:8096
        - Vaultwarden:
            icon: vaultwarden.png
            href: https://parker-nuc7i5bnh.tail702c13.ts.net
            description: Password manager
            siteMonitor: http://vaultwarden.default.svc.cluster.local
  widgets.yaml: |
    - resources:
        cpu: true
        memory: true
        disk: /
    - search:
        provider: duckduckgo
        target: _blank
    - datetime:
        text_size: md
        format:
          timeStyle: short
          dateStyle: short
  bookmarks.yaml: |
    - Links:
        - GitHub:
            - href: https://github.com/ParkerRubin/homelab
        - Tailscale:
            - href: https://login.tailscale.com/admin/machines
  docker.yaml: ""
  kubernetes.yaml: ""
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:latest
        env:
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "*"
        ports:
        - containerPort: 3000
        volumeMounts:
        - { name: config, mountPath: /app/config/settings.yaml,   subPath: settings.yaml }
        - { name: config, mountPath: /app/config/services.yaml,   subPath: services.yaml }
        - { name: config, mountPath: /app/config/widgets.yaml,    subPath: widgets.yaml }
        - { name: config, mountPath: /app/config/bookmarks.yaml,  subPath: bookmarks.yaml }
        - { name: config, mountPath: /app/config/docker.yaml,     subPath: docker.yaml }
        - { name: config, mountPath: /app/config/kubernetes.yaml, subPath: kubernetes.yaml }
        - { name: logs,   mountPath: /app/config/logs }
      volumes:
      - name: config
        configMap:
          name: homepage-config
      - name: logs
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
spec:
  type: NodePort
  selector:
    app: homepage
  ports:
  - port: 3000
    nodePort: 30010
