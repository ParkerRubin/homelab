apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: filebrowser-db
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: filebrowser
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: filebrowser
  template:
    metadata:
      labels:
        app: filebrowser
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: filebrowser
        image: filebrowser/filebrowser:latest
        env:
        - { name: FB_ADDRESS,  value: "0.0.0.0" }
        - { name: FB_PORT,     value: "8080" }
        - { name: FB_ROOT,     value: "/srv" }
        - { name: FB_DATABASE, value: "/database/filebrowser.db" }
        ports:
        - containerPort: 8080
        volumeMounts:
        - { name: db,    mountPath: /database }
        - { name: share, mountPath: /srv/share }
        - { name: media, mountPath: /srv/media }
      volumes:
      - name: db
        persistentVolumeClaim:
          claimName: filebrowser-db
      - name: share
        hostPath:
          path: /home/parker/share
      - name: media
        hostPath:
          path: /home/parker/Homelab/Homelab/Jellyfin/media
---
apiVersion: v1
kind: Service
metadata:
  name: filebrowser
spec:
  type: NodePort
  selector:
    app: filebrowser
  ports:
  - port: 8080
    nodePort: 30020
