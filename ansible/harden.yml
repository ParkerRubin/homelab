# Hardening for the NUC. Dry run:  ansible-playbook -i inventory.ini harden.yml -K --check --diff
#                        Apply:    ansible-playbook -i inventory.ini harden.yml -K
- name: Harden the NUC (keeps password SSH, k3s, Docker and Tailscale working)
  hosts: nuc
  become: true

  vars:
    # ---------------- OS hardening ----------------
    sysctl_overwrite:
      net.ipv4.ip_forward: 1               # k3s, Docker, Tailscale need forwarding
      net.ipv6.conf.all.forwarding: 1
      net.ipv4.conf.all.rp_filter: 2       # loose, so Tailscale subnet routing works
      net.ipv4.conf.default.rp_filter: 2
    os_filesystem_whitelist:
      - squashfs                           # snaps (helm)
      - vfat                               # /boot/efi
    os_auditd_enabled: true
    os_auth_pw_max_age: 99999              # do not force password expiry
    hidepid_option: "0"                    # keep /proc visible (GNOME, node-exporter)

    # ---------------- SSH hardening ----------------
    ssh_server_password_login: true        # keep password logins
    sshd_authenticationmethods: "any"       # default is keys only, which would lock you out
    ssh_permit_root_login: "no"
    ssh_allow_users: "parker"
    ssh_max_auth_retries: 4
    ssh_client_alive_interval: 300
    ssh_client_alive_count: 2
    ssh_allow_tcp_forwarding: "local"      # VS Code Remote-SSH
    sftp_enabled: true                     # modern scp uses SFTP

  roles:
    - devsec.hardening.os_hardening
    - devsec.hardening.ssh_hardening

  tasks:
    - name: Install unattended-upgrades
      ansible.builtin.apt:
        name: unattended-upgrades
        state: present
        update_cache: true

    - name: Turn on daily automatic security updates
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/20auto-upgrades
        mode: "0644"
        content: |
          APT::Periodic::Update-Package-Lists "1";
          APT::Periodic::Unattended-Upgrade "1";
          APT::Periodic::AutocleanInterval "7";

    - name: Never auto-reboot (this box is the house DNS)
      ansible.builtin.copy:
        dest: /etc/apt/apt.conf.d/52no-auto-reboot
        mode: "0644"
        content: |
          Unattended-Upgrade::Automatic-Reboot "false";

  post_tasks:
    - name: Check SSH config is valid before anyone logs out
      ansible.builtin.command: sshd -t
      changed_when: false
